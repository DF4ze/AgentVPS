# Copier ce fichier en application.yml (non versionne, voir .gitignore) puis
# renseigner les vraies valeurs / variables d'environnement avant de lancer le service.

spring:
  application:
    name: agentvps

logging:
  file:
    name: logs/agentvps.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] chat=%X{chatId:-} project=%X{project:-} %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] chat=%X{chatId:-} project=%X{project:-} %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  level:
    root: INFO
    fr.ses10doigts.agentvps: INFO

telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bots:
    - id: agentvps-bot
      token: ${TELEGRAM_AGENTVPS_BOT_TOKEN:}
      polling-enabled: true
      auto-register-commands: true
      configure-menu-button: true
      security:
        # A renseigner avant la mise en prod (Phase 1 securite de la roadmap) :
        # ID Telegram numerique(s) autorises. Liste vide = tout le monde autorise.
        allowed-user-ids: []
      retry:
        enabled: true
        max-attempts: 3
        delay-seconds: 2

# Configuration propre a AgentVPS (Phase 3 de la roadmap : service de pilotage
# de Claude Code). Complete au fur et a mesure de l'implementation.
agentvps:
  claude:
    # Chemin du binaire claude installe sous l'utilisateur dedie (agentvps),
    # voir roadmap-implementation.md, Phase 0bis.
    binary-path: ${AGENTVPS_CLAUDE_BINARY:/home/agentvps/.local/bin/claude}
    # Delai maximum (secondes) avant destruction forcee du process claude.
    timeout-seconds: ${AGENTVPS_CLAUDE_TIMEOUT_SECONDS:120}
    # Appel de test au demarrage (ClaudeCliSmokeTestRunner) : desactive par defaut,
    # a activer uniquement sur un environnement ou claude est installe et authentifie
    # (le VPS, pas le poste de dev) - voir roadmap-implementation.md, Phase 3, point 3.
    smoke-test-enabled: ${AGENTVPS_CLAUDE_SMOKE_TEST:false}
    smoke-test-prompt: "${AGENTVPS_CLAUDE_SMOKE_TEST_PROMPT:Reponds uniquement avec le mot pong}"
    # Phase 1 (securite) : sans ces deux options, claude ne peut faire AUCUNE action
    # sur le filesystem en headless (teste le 28/08/2026). "dontAsk" refuse tout ce qui
    # n'est pas explicitement autorise dans le settings.json (permission.allow) - voir
    # ce fichier pour les regles allow/ask/deny (src/main/resources/claude-settings.json,
    # a deployer sur le VPS au chemin ci-dessous).
    permission-mode: ${AGENTVPS_CLAUDE_PERMISSION_MODE:dontAsk}
    settings-path: ${AGENTVPS_CLAUDE_SETTINGS_PATH:/home/agentvps/.config/agentvps/claude-settings.json}
    # Coupe l'"auto memory" native de Claude Code (ecriture spontanee dans
    # ~/.claude/projects/<projet>/memory/, distincte de CLAUDE.md) - bloquee de toute
    # facon par le settings.json ci-dessus (deny sur ~/.claude/**), donc autant eviter
    # que claude perde des tours a tenter d'y ecrire. Voir ClaudeCliProperties.
    disable-auto-memory: ${AGENTVPS_CLAUDE_DISABLE_AUTO_MEMORY:true}
    # Fournisseur utilise pour l'appel : ANTHROPIC (API native, defaut) ou OPENROUTER
    # (route via Ori Harness vers un modele OpenRouter - voir les deux cles ci-dessous
    # et la memoire projet "ori_openrouter_integration" pour le contexte complet).
    provider: ${AGENTVPS_CLAUDE_PROVIDER:ANTHROPIC}
    # Chemin absolu du binaire ori, utilise uniquement si provider=OPENROUTER.
    open-router-binary-path: ${AGENTVPS_CLAUDE_OPENROUTER_BINARY:/home/agentvps/.local/bin/ori}
    # Modele OpenRouter a utiliser (ex "openai/gpt-5"), utilise uniquement si
    # provider=OPENROUTER. Vide = ori utilise son modele par defaut.
    open-router-model: ${AGENTVPS_CLAUDE_OPENROUTER_MODEL:}
    # Frequence (en nombre de messages @Chat sur une meme conversation) du renforcement
    # periodique (rappel CLAUDE.md + permissions, injecte en prefixe du message utilisateur,
    # PAS via --append-system-prompt) - voir ClaudeCliProperties.reinforcementEveryMessages.
    # Le premier message d'une conversation est toujours renforce, independamment de ce seuil.
    reinforcement-every-messages: ${AGENTVPS_CLAUDE_REINFORCEMENT_EVERY_MESSAGES:10}
  workspace:
    # Dossier partage (memoires/doc inter-projets) et dossier des projets
    # (un sous-dossier par projet, avec son propre CLAUDE.md), voir roadmap
    # Phase 3, points 5 et 6.
    root-dir: ${AGENTVPS_WORKSPACE_ROOT:${user.home}/AgentVPS}
